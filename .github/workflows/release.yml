name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable version to validate without publishing
        required: true
        default: v1.0.0
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4

      - name: Validate tag and app version
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python3 - "$RELEASE_TAG" <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Stable release tag required, got {tag!r}")
          version = tag.removeprefix("v")
          source = pathlib.Path("app/build.gradle.kts").read_text()
          version_name = re.search(r'versionName = "([^"]+)"', source)
          version_code = re.search(r"versionCode = ([0-9]+)", source)
          application_id = re.search(r'applicationId = "([^"]+)"', source)
          if not version_name or version != version_name.group(1):
              raise SystemExit(f"{tag} does not match Android versionName")
          if not version_code or int(version_code.group(1)) < 1:
              raise SystemExit("Android versionCode must be a positive integer")
          if not application_id or application_id.group(1) != "ai.openonion.messages":
              raise SystemExit("Unexpected Android applicationId")

          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## {version} —" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no {version} entry")
          notes_path = pathlib.Path("docs/releases") / f"{version}.md"
          if not notes_path.is_file():
              raise SystemExit(f"Missing curated release notes: {notes_path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"version_code={version_code.group(1)}", file=output)
              print(f"notes_path={notes_path}", file=output)
          PY

      - name: Restore release signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openonion-messages-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/openonion-messages-release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Create ephemeral preflight signing key
        if: github.event_name == 'workflow_dispatch'
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/openonion-messages-preflight.jks" \
            -storepass preflight-only \
            -keypass preflight-only \
            -alias openonion-messages-preflight \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=Ephemeral CI Preflight, O=OpenOnion"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/openonion-messages-preflight.jks"
            printf 'storePassword=preflight-only\n'
            printf 'keyAlias=openonion-messages-preflight\n'
            printf 'keyPassword=preflight-only\n'
          } > keystore.properties

      - name: Verify and build signed artifacts
        run: ./gradlew test lint bundleRelease assembleRelease

      - name: Verify signature and prepare release files
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenOnion-Messages-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/OpenOnion-Messages-${RELEASE_TAG}.aab"
          apk="dist/OpenOnion-Messages-${RELEASE_TAG}.apk"
          aab="dist/OpenOnion-Messages-${RELEASE_TAG}.aab"
          test "$(apkanalyzer manifest application-id "$apk")" = "ai.openonion.messages"
          test "$(apkanalyzer manifest version-name "$apk")" = "$RELEASE_VERSION"
          test "$(apkanalyzer manifest version-code "$apk")" = "$RELEASE_VERSION_CODE"
          test "$(apkanalyzer manifest min-sdk "$apk")" = "26"
          test "$(apkanalyzer manifest target-sdk "$apk")" = "36"
          test "$(apkanalyzer manifest debuggable "$apk")" = "false"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk"
          aab_report="$(jarsigner -verify -verbose -certs "$aab" 2>&1)"
          printf '%s\n' "$aab_report"
          grep -Fq 'jar verified.' <<< "$aab_report"
          if grep -Fq 'jar is unsigned' <<< "$aab_report"; then
            echo 'AAB is unsigned' >&2
            exit 1
          fi
          (
            cd dist
            sha256sum "OpenOnion-Messages-${RELEASE_TAG}.apk" \
              "OpenOnion-Messages-${RELEASE_TAG}.aab" \
              > "OpenOnion-Messages-${RELEASE_TAG}-SHA256SUMS.txt"
          )

      - name: Attest release provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/OpenOnion-Messages-${{ env.RELEASE_TAG }}-SHA256SUMS.txt

      - name: Confirm preflight is non-publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF_TYPE" = "branch"
          echo "Signed release pipeline preflight passed; no artifact was published."

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/OpenOnion-Messages-${RELEASE_TAG}.apk
          dist/OpenOnion-Messages-${RELEASE_TAG}.aab
          dist/OpenOnion-Messages-${RELEASE_TAG}-SHA256SUMS.txt
          --verify-tag
          --notes-file "${{ steps.release.outputs.notes_path }}"
          --title "OpenOnion Messages ${RELEASE_TAG}"
