name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew test lint assembleDebug assembleRelease

  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openonion_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openonion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openonion/oo-api
          path: .e2e/oo-api
      - uses: actions/checkout@v4
        with:
          repository: openonion/connectonion
          path: .e2e/connectonion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Install cross-repository E2E runtimes
        run: |
          python -m venv .e2e/oo-venv
          .e2e/oo-venv/bin/pip install \
            -r .e2e/oo-api/requirements.txt \
            -r .e2e/oo-api/tests/requirements-test.txt
          python -m venv .e2e/connect-venv
          .e2e/connect-venv/bin/pip install -e .e2e/connectonion
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CONNECTONION_PYTHON: ${{ github.workspace }}/.e2e/connect-venv/bin/python
          OO_API_PYTHON: ${{ github.workspace }}/.e2e/oo-venv/bin/python
          SMS_INBOX_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/openonion_test
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            ./scripts/verify-real-e2e.py
            --oo-api .e2e/oo-api
            --connectonion .e2e/connectonion
